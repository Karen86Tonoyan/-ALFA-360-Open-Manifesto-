<svg width="1200" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C5A059;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E5C579;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C5A059;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="#080808"/>
  
  <!-- Decorative lines -->
  <line x1="0" y1="50" x2="1200" y2="50" stroke="#C5A059" stroke-width="1" opacity="0.3"/>
  <line x1="0" y1="350" x2="1200" y2="350" stroke="#C5A059" stroke-width="1" opacity="0.3"/>
  
  <!-- Main title -->
  <text x="600" y="160" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="90" font-weight="900" fill="url(#goldGrad)" filter="url(#glow)">ALFA 360</text>
  
  <!-- Subtitle -->
  <text x="600" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" fill="#E0E0E0" letter-spacing="8">ZERO HALLUCINATION PROTOCOL</text>
  
  <!-- Author -->
  <text x="600" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#C5A059">by Karen Tonoyan</text>
  
  <!-- Tagline -->
  <text x="600" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#A0A0A0" font-style="italic">"Zero halucynacji. Zero chaosu. Zero kompromisów."</text>
  
  <!-- Corner decorations -->
  <polygon points="0,0 80,0 0,80" fill="#C5A059" opacity="0.2"/>
  <polygon points="1200,0 1120,0 1200,80" fill="#C5A059" opacity="0.2"/>
  <polygon points="0,400 80,400 0,320" fill="#C5A059" opacity="0.2"/>
  <polygon points="1200,400 1120,400 1200,320" fill="#C5A059" opacity="0.2"/>
</svg>
